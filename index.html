<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zunera</title>
    <script>
      let themePreference = 'system'
      try {
        const storedTheme = localStorage.getItem('zunera.theme')
        if (['light', 'dark', 'system'].includes(storedTheme)) themePreference = storedTheme
      } catch {
        // Use the device preference when storage is unavailable.
      }
      const systemDark = window.matchMedia?.('(prefers-color-scheme: dark)').matches ?? false
      document.documentElement.dataset.theme = themePreference === 'system'
        ? (systemDark ? 'dark' : 'light')
        : themePreference
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
